<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rolldex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky"></div>
  <div class="app">
    <aside class="dock">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <strong>Rolldex</strong>
          <small>Unofficial pack rolls</small>
        </div>
      </div>
      <nav class="tabs" aria-label="Main">
        <button type="button" data-screen="home" class="is-on">Packs</button>
        <button type="button" data-screen="collection">Collection</button>
        <button type="button" data-screen="dex">Dex</button>
        <button type="button" data-screen="trade">Trade</button>
        <button type="button" data-screen="menu">Menu</button>
      </nav>
      <p class="legal">Fan project for fun. Not affiliated with Nintendo, The Pokémon Company, Creatures, or TCGplayer. Nothing here is for sale.</p>
    </aside>

    <div class="stage">
      <header class="top">
        <div class="who">
          <div class="ring" id="level-ring"><span id="level">1</span></div>
          <div>
            <div class="who-name" id="player-name">Trainer</div>
            <div class="xp"><span id="xp-label">0 / 80 xp</span><i id="xp-bar"></i></div>
          </div>
        </div>
        <div class="stats">
          <div><b id="stat-unique">0</b><span>unique</span></div>
          <div><b id="stat-copies">0</b><span>copies</span></div>
          <div><b id="stat-worth">$0</b><span>collection</span></div>
        </div>
      </header>
      <main id="screen" class="screen"></main>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
